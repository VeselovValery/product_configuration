{% extends 'base.html' %}
{% block refresh %}
  <meta http-equiv="refresh" content="300">
{% endblock %}
{% block title %}
  РАСЧЕТЫ
{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 p-5">
      <div class="card text-center border-dark shadow-sm">
        <h5 class="card-header border-dark text-white bg-custom-blue">КОНФИГУРАЦИЯ НАЗВАНИЯ И ЦЕНЫ ПРОДУКТА</h5>
        <div class="card-body bg-custom-grey">
          <form id="config-form" method="post" action="{% url 'configuration:index' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group row my-3">
              <label for="product-type" class="label-bold">
                  Тип изделия
              </label>
              <select class="form-control border-dark" name="product_type" id="product-type">
                  {% for type in product_types %}
                      <option value="{{ type.name }}" {% if forloop.first %}selected{% endif %}>{{ type.name }}</option>
                  {% endfor %}
              </select>
              <small id="product-type-help" class="form-text text-muted">
                <br>
              </small>
              <label for="base-name" class="label-bold">
                  Наименование базовой версии продукта
              </label>
              <input class="form-control border-dark" type="text" id="base-name" name="base_name" placeholder="Введите наименование базовой версии" disabled>
              <small id="base-name-help" class="form-text text-muted">
                <br>
              </small>
              <div id="suggestions" style="display:none;">
                  <ul id="suggestion-list" style="list-style-type: none;"></ul>
              </div>
              <label for="product-type" class="label-bold">
                Опции изделия
              </label>
              <div id="options-container">
                <!-- Сюда подгружаются опции -->
              </div>
            </div>
            <div class="d-flex justify-content-around">
              <button type="submit" id="submit-btn" class="btn btn-primary text_russo bg-custom-blue" disabled>РАССЧИТАТЬ</button>
            </div>
          </form>
          <div id="result-container" style="display: none; margin-top: 20px;" class="card">
            <div class="card-body">
                <p><span id="full-name" class="label-bold"></span></p>
                <p><span id="total-price" class="label-bold"></span> <strong>руб.</strong></p>
            </div>
          </div> <!-- result-container -->  
        </div> <!-- card body -->
      </div> <!-- card -->
    </div> <!-- col -->
  </div> <!-- row -->
  <script>
    const baseNameInput = document.getElementById('base-name');
    const productTypeSelect = document.getElementById('product-type');
    const suggestionsDiv = document.getElementById('suggestions');
    const suggestionList = document.getElementById('suggestion-list');
    const submitBtn = document.getElementById('submit-btn');
    const optionsContainer = document.getElementById('options-container');
    const optionsDataMap = {};
    let currentSuggestions = [];

    function asArray(value) {
        if (Array.isArray(value)) {
            return value;
        }
        if (value === undefined || value === null || value === '') {
            return [];
        }
        return [value];
    }

    function getDescriptionForName(optionData, nameValue) {
        if (!optionData) {
            return '';
        }
        const names = asArray(optionData.name);
        const descriptions = asArray(optionData.description);
        if (!names.length) {
            return descriptions[0] || '';
        }
        const index = names.indexOf(nameValue);
        if (index !== -1) {
            return descriptions[index] || '';
        }
        return descriptions[0] || '';
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (productTypeSelect.value) {
            const event = new Event('change');
            productTypeSelect.dispatchEvent(event);
        }
    });

    // Хранилище для отслеживания количества добавленных опций
    const optionCounts = {};

    // Функция для создания HTML одного элемента опции
    function createOptionHTML(opt, instanceIndex = 0) {
        const optionKey = String(opt.id);
        const optionId = `${optionKey}_${instanceIndex}`;
        
        // Обработка поля name: если массив с 2+ значениями - select, иначе - div
        let nameHTML = '';
        const nameArray = asArray(opt.name);
        
        if (nameArray.length > 1) {
            let nameOptionsHTML = '';
            nameArray.forEach((nameVal, idx) => {
                nameOptionsHTML += `<option value="${nameVal}" ${idx === 0 ? 'selected' : ''}>${nameVal}</option>`;
            });
            nameHTML = `
                <div class="option-name-block">
                    <select name="option_name_${optionId}" class="form-control border-dark option-name-select">
                        ${nameOptionsHTML}
                    </select>
                </div>
            `;
        } else {
            const displayName = nameArray.length > 0 ? nameArray[0] : (opt.name || '');
            // Добавляем скрытое поле для отправки имени, если оно одно
            nameHTML = `
                <div class="option-name-block option-name">
                    ${displayName}
                </div>
                <input type="hidden" name="option_name_${optionId}" value="${displayName}">
            `;
        }

        const currentName = nameArray.length > 0 ? nameArray[0] : (opt.name || '');
        const currentDescription = getDescriptionForName(opt, currentName);

        // Обработка поля value (остается как было)
        let valueOptionsHTML = '';
        if (opt.value && Array.isArray(opt.value)) {
            opt.value.forEach(val => {
                valueOptionsHTML += `<option value="${val}">${val}</option>`;
            });
        }

        // Определение, показывать ли кнопки Add/Delete
        const maxValue = Number(opt.max_value) || 0;
        const currentCount = optionCounts[optionKey] || 1;
        const showAddBtn = maxValue > 0 && currentCount < maxValue;
        const showDeleteBtn = currentCount > 1;

        let buttonsHTML = '<div class="option-buttons" style="margin-top: 5px;">';
        if (showAddBtn) {
            buttonsHTML += `<button type="button" class="btn btn-primary text_russo bg-custom-blue add-option-btn" data-option-id="${opt.id}">ДОБАВИТЬ</button> `;
        }
        if (showDeleteBtn) {
            buttonsHTML += `<button type="button" class="btn btn-primary text_russo bg-custom_terra delete-option-btn" data-option-instance="${optionId}">УДАЛИТЬ</button>`;
        }
        buttonsHTML += '</div>';

        return `
            <div class="option-item" data-option-id="${optionKey}" data-instance-id="${optionId}">
                ${nameHTML}
                <div class="option-row">
                    <div class="option-description">
                        ${currentDescription || ''}
                    </div>
                    <div class="option-select">
                        <select name="option_${optionId}" class="form-control border-dark">
                            ${valueOptionsHTML}
                        </select>
                    </div>
                </div>
                ${buttonsHTML}
            </div>
        `;
    }

    // Функция для добавления новой копии опции
    function addOptionInstance(optionKey, optionData) {
        if (!optionCounts[optionKey]) {
            optionCounts[optionKey] = 1;
        }
        optionCounts[optionKey]++;
        
        const instanceIndex = optionCounts[optionKey] - 1;
        const newOptionHTML = createOptionHTML(optionData, instanceIndex);
        
        // Найти родительский контейнер опций с таким optionId (только блоки .option-item)
        const existingOptions = document.querySelectorAll(`.option-item[data-option-id="${optionKey}"]`);
        const lastOption = existingOptions[existingOptions.length - 1];
        lastOption.insertAdjacentHTML('afterend', newOptionHTML);
        
        // Обновить все опции с этим optionId (чтобы обновить кнопки)
        refreshOptionButtons(optionKey, optionData);
    }

    // Функция для удаления экземпляра опции
    function deleteOptionInstance(instanceId, optionKey, optionData) {
        const instanceElement = document.querySelector(`[data-instance-id="${instanceId}"]`);
        if (instanceElement && optionCounts[optionKey] > 1) {
            instanceElement.remove();
            optionCounts[optionKey]--;
            refreshOptionButtons(optionKey, optionData);
        }
    }

    // Функция для обновления кнопок Add/Delete всех экземпляров опции
    function refreshOptionButtons(optionKey, optionData) {
        // Обновляем кнопки только внутри контейнеров .option-item
        const instances = document.querySelectorAll(`.option-item[data-option-id="${optionKey}"]`);
        const currentCount = optionCounts[optionKey] || 1;
        const maxValue = Number(optionData.max_value) || 0;
        
        instances.forEach((instance, index) => {
            const buttonsContainer = instance.querySelector('.option-buttons');
            if (buttonsContainer) {
                const showAddBtn = maxValue > 0 && currentCount < maxValue;
                const showDeleteBtn = currentCount > 1;
                
                let buttonsHTML = '';
                if (showAddBtn) {
                    buttonsHTML += `<button type="button" class="btn btn-primary text_russo bg-custom-blue add-option-btn" data-option-id="${optionKey}">ДОБАВИТЬ</button> `;
                }
                if (showDeleteBtn) {
                    const instanceId = instance.getAttribute('data-instance-id');
                    buttonsHTML += `<button type="button" class="btn btn-primary text_russo bg-custom_terra delete-option-btn" data-option-instance="${instanceId}">УДАЛИТЬ</button>`;
                }
                buttonsContainer.innerHTML = buttonsHTML;
            }
        });
    }

    // Обработчики событий для кнопок Add/Delete (делегирование событий)
    optionsContainer.addEventListener('click', function(e) {
        if (e.target.classList.contains('add-option-btn')) {
            const optionKey = e.target.getAttribute('data-option-id');
            const optionData = optionsDataMap[optionKey];
            if (optionData) {
                addOptionInstance(optionKey, optionData);
            }
        } else if (e.target.classList.contains('delete-option-btn')) {
            const instanceId = e.target.getAttribute('data-option-instance');
            const instanceElement = document.querySelector(`[data-instance-id="${instanceId}"]`);
            const optionKey = instanceElement.getAttribute('data-option-id');
            const optionData = optionsDataMap[optionKey];
            if (optionData) {
                deleteOptionInstance(instanceId, optionKey, optionData);
            }
        }
    });

    optionsContainer.addEventListener('change', function(e) {
        if (e.target.classList.contains('option-name-select')) {
            const optionItem = e.target.closest('.option-item');
            if (!optionItem) {
                return;
            }
            const optionKey = optionItem.getAttribute('data-option-id');
            const optionData = optionsDataMap[optionKey];
            if (!optionData) {
                return;
            }
            const selectedName = e.target.value;
            const description = getDescriptionForName(optionData, selectedName);
            const descriptionElement = optionItem.querySelector('.option-description');
            if (descriptionElement) {
                descriptionElement.textContent = description || '';
            }
        }
    });

    productTypeSelect.addEventListener('change', function() {
        if (this.value) {
            baseNameInput.disabled = false;
            baseNameInput.value = '';
            suggestionsDiv.style.display = 'none';
            submitBtn.disabled = true;
            currentSuggestions = [];
            
            // Очистить счетчики опций
            Object.keys(optionCounts).forEach(key => delete optionCounts[key]);
            Object.keys(optionsDataMap).forEach(key => delete optionsDataMap[key]);

            fetch(`{% url 'configuration:options' %}?type_id=${this.value}`)
            .then(response => response.json())
            .then(options => {
              optionsContainer.innerHTML = '';
              if (options.length === 0) {
                    optionsContainer.innerHTML = '<p>Нет доступных опций для этого типа продукта.</p>';
                    return;
                }
              // Сохранить данные опций для последующего использования
              options.forEach(opt => {
                  const optionKey = String(opt.id);
                  optionsDataMap[optionKey] = opt;
                  optionCounts[optionKey] = 1;
                  
                  const optionHTML = createOptionHTML(opt, 0);
                  optionsContainer.insertAdjacentHTML('beforeend', optionHTML);
              });
            });
        } else {
            baseNameInput.disabled = true;
            suggestionsDiv.style.display = 'none';
            submitBtn.disabled = true;
            currentSuggestions = [];
        }
    });

    baseNameInput.addEventListener('input', function() {
        const query = this.value;
        const typeId = productTypeSelect.value;

        if (query.length < 2 || !typeId) {
            suggestionsDiv.style.display = 'none';
            submitBtn.disabled = true;
            currentSuggestions = [];
            return;
        }

        fetch(`{% url 'configuration:autocomplete' %}?q=${encodeURIComponent(query)}&type_id=${typeId}`)
            .then(response => response.json())
            .then(data => {
                currentSuggestions = data;
                suggestionList.innerHTML = '';
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    li.onclick = () => {
                        baseNameInput.value = item;
                        suggestionsDiv.style.display = 'none';
                        submitBtn.disabled = false;
                    };
                    suggestionList.appendChild(li);
                });
                if (data.length) {
                    suggestionsDiv.style.display = 'block';
                    if (currentSuggestions.includes(query)) {
                        suggestionsDiv.style.display = 'none';
                        submitBtn.disabled = false;
                    } else {
                        suggestionsDiv.style.display = 'block';
                        submitBtn.disabled = true;
                    }
                } else {
                    suggestionsDiv.style.display = 'none';
                    submitBtn.disabled = true;
                }
            });
    });

    // Добавляем обработчик на удаление символов
    baseNameInput.addEventListener('input', function() {
        const query = this.value;

        // Если текущие подсказки содержат введённое значение — активируем кнопку
        if (currentSuggestions.includes(query)) {
            suggestionsDiv.style.display = 'none';
            submitBtn.disabled = false;
        } else {
            // Если нет — показываем подсказки и деактивируем кнопку
            if (query.length >= 2 && currentSuggestions.length > 0) {
                suggestionsDiv.style.display = 'block';
            } else {
                suggestionsDiv.style.display = 'none';
            }
            submitBtn.disabled = true;
        }
    });

    document.getElementById('config-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      fetch('{% url "configuration:index" %}', {
          method: 'POST',
          body: formData,
          headers: {
              'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
          }
      })
      .then(response => response.json())
      .then(data => {
            // Показываем результат
            document.getElementById('full-name').textContent = data.full_name;
            document.getElementById('total-price').textContent = data.total_price;

            document.getElementById('result-container').style.display = 'block';
        })
      .catch(error => {
          console.error('Ошибка:', error);
      });
    });
    let currentIndex = -1;

    function highlight(index) {
        const items = suggestionList.querySelectorAll('li');
        items.forEach((li, i) => {
            li.style.backgroundColor = (i === index) ? '#d0e8ff' : '';
        });
    }

    baseNameInput.addEventListener('keydown', (e) => {
        const items = suggestionList.querySelectorAll('li');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (currentIndex < items.length - 1) {
                currentIndex++;
            }
            highlight(currentIndex);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (currentIndex > 0) {
                currentIndex--;
            }
            highlight(currentIndex);
        } else if (e.key === 'Enter' && currentIndex >= 0) {
            e.preventDefault();
            baseNameInput.value = items[currentIndex].textContent;
            suggestionsDiv.style.display = 'none';
            submitBtn.disabled = false;
            currentIndex = -1;
        }
    });
  </script>
{% endblock %}
